workflows:
  android-workflow:
    name: AI Video Maker - Android
    max_build_duration: 60
    environment:
      flutter: 3.24.5
    scripts:
      - name: Scaffold missing platform folders
        script: |
          flutter create . --platforms=android --org com.yourname.aivideomaker
      - name: Remove auto-generated test file
        script: |
          rm -rf test
      - name: Add INTERNET permission to AndroidManifest.xml
        script: |
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>#' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
