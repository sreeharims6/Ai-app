workflows:
  android-workflow:
    name: AI Video Maker - Android
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Scaffold missing platform folders
        script: |
          flutter create . --platforms=android --org com.yourname.aivideomaker
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
